[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcpuzzles"
version = "0.5.0"
description = "Independent ARC puzzle/generator queries, reference execution, and review workspaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
runtime = ["numpy>=1.26", "Pillow>=10"]
dev = ["pytest>=8"]
tensors = ["torch>=2.5", "safetensors>=0.5"]

[project.scripts]
arcpuzzles = "arcpuzzles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arcpuzzles*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
